name: Mikrofon
options:
  bundleIdPrefix: de.robin
  deploymentTarget:
    iOS: "26.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  Mikrofon:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Mikrofon
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.robin.mikrofon
        PRODUCT_NAME: "Live Mic"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        ENABLE_PREVIEWS: YES
    info:
      path: Mikrofon/Info.plist
      properties:
        CFBundleDisplayName: "Live Mic"
        NSMicrophoneUsageDescription: "Live Mic benötigt dein Mikrofon, damit deine Stimme live über den ausgewählten Lautsprecher wiedergegeben werden kann."
        UIBackgroundModes:
          - audio
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    scheme:
      gatherCoverageData: false
